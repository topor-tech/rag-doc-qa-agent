services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  knowledge:
    build:
      context: .
      dockerfile: back/knowledge/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://knowledge:knowledge@postgres:5432/rag
      KNOWLEDGE_DIR: /data/knowlage_files
    depends_on:
      postgres:
        condition: service_healthy

  chat:
    build:
      context: ./back/chat
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://chat:chat@postgres:5432/rag
      KNOWLEDGE_URL: http://knowledge:8001
      REG_CLOUD_CHAT_API_KEY: ${REG_CLOUD_CHAT_API_KEY:?set REG_CLOUD_CHAT_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      knowledge:
        condition: service_healthy

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:7000:80"
    depends_on:
      chat:
        condition: service_healthy

volumes:
  postgres_data:
