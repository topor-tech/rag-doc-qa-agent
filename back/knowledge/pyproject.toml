[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge"
version = "0.1.0"
description = "Regulation catalog and full-text search"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.165.0",
    "mcp>=2.3.0",
    "psycopg[binary]>=3.2",
    "pymorphy3>=2.0.6",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[project.scripts]
knowledge = "knowledge.main:main"

[tool.hatch.build.targets.wheel]
packages = ["knowledge"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["."]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "RET", "ARG", "PTH"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["knowledge"]
