exclude: |
  (?x)^(
      front/node_modules/|
      back/chat/\.venv/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-yaml
      - id: check-json
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: oxlint
        name: oxlint (js/ts)
        entry: npm
        language: system
        args: ["run", "lint", "--prefix", "front"]
        pass_filenames: false
        files: ^front/.*\.(cjs|mjs|js|jsx|ts|tsx)$
      - id: mypy
        name: mypy (chat)
        entry: uv
        language: system
        args: ["run", "--directory", "back/chat", "mypy"]
        pass_filenames: false
        files: ^back/chat/.*\.py$
